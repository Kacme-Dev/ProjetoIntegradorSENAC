<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServGo! — Acesso Administrativo</title>
    <!-- Sem indexação por robôs -->
    <meta name="robots" content="noindex, nofollow, noarchive">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/estiloServGo.css">
    <style>
        /* ── Página de login admin — layout imersivo ── */
        html, body { height: 100%; margin: 0; }

        .adm-login-page {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a14 0%, #0f1b35 50%, #14213d 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            position: relative;
            overflow: hidden;
        }

        /* Grade de fundo sutil */
        .adm-login-page::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(20,106,219,.07) 1px, transparent 1px),
                linear-gradient(90deg, rgba(20,106,219,.07) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
        }

        /* Glow central */
        .adm-login-page::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(20,106,219,.12) 0%, transparent 70%);
            pointer-events: none;
        }

        /* Card de login */
        .adm-login-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            background: rgba(255,255,255,.04);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 16px;
            padding: 40px 36px 36px;
            box-shadow:
                0 24px 60px rgba(0,0,0,.6),
                0 0 0 1px rgba(20,106,219,.15),
                inset 0 1px 0 rgba(255,255,255,.07);
            backdrop-filter: blur(12px);
        }

        /* Logo */
        .adm-login-logo {
            text-align: center;
            margin-bottom: 8px;
        }
        .adm-login-logo .serv-part {
            font-size: 2rem;
            font-weight: 900;
            color: #fff;
            letter-spacing: -1px;
        }
        .adm-login-logo .go-part {
            font-size: 2rem;
            font-weight: 900;
            color: #FFC300;
            letter-spacing: -1px;
        }

        /* Badge admin */
        .adm-login-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(20,106,219,.2);
            border: 1px solid rgba(20,106,219,.4);
            color: #7fb3f5;
            font-size: .72rem;
            font-weight: 700;
            padding: 3px 12px;
            border-radius: 20px;
            letter-spacing: .06em;
            text-transform: uppercase;
            margin-bottom: 28px;
        }

        /* Campos */
        .adm-field-label {
            color: rgba(255,255,255,.75);
            font-size: .82rem;
            font-weight: 600;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .adm-input {
            width: 100%;
            background: rgba(255,255,255,.06);
            border: 1.5px solid rgba(255,255,255,.12);
            border-radius: 8px;
            color: #fff;
            padding: 10px 14px;
            font-size: .92rem;
            transition: border-color .2s, box-shadow .2s;
            outline: none;
        }
        .adm-input::placeholder { color: rgba(255,255,255,.3); }
        .adm-input:focus {
            border-color: #146ADB;
            box-shadow: 0 0 0 3px rgba(20,106,219,.2);
            background: rgba(255,255,255,.08);
        }
        .adm-input.erro {
            border-color: #ef4444;
            box-shadow: 0 0 0 3px rgba(239,68,68,.18);
        }

        /* Toggle senha */
        .adm-input-wrap { position: relative; }
        .adm-toggle-senha {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255,255,255,.4);
            cursor: pointer;
            padding: 2px;
            font-size: 1rem;
            line-height: 1;
            transition: color .15s;
        }
        .adm-toggle-senha:hover { color: rgba(255,255,255,.75); }

        /* Mensagem de erro / alerta */
        .adm-alerta {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: .85rem;
            margin-bottom: 18px;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }
        .adm-alerta.erro    { background: rgba(239,68,68,.15); border: 1px solid rgba(239,68,68,.35); color: #fca5a5; }
        .adm-alerta.aviso   { background: rgba(255,195,0,.12);  border: 1px solid rgba(255,195,0,.3);  color: #fde68a; }
        .adm-alerta.sucesso { background: rgba(34,197,94,.12);  border: 1px solid rgba(34,197,94,.3);  color: #86efac; }

        /* Botão principal */
        .adm-btn-entrar {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            background: linear-gradient(135deg, #146ADB, #0d4fa3);
            border: none;
            color: #fff;
            font-size: .95rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity .18s, transform .12s, box-shadow .18s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(20,106,219,.35);
            letter-spacing: .02em;
        }
        .adm-btn-entrar:hover:not(:disabled) {
            opacity: .92;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(20,106,219,.45);
        }
        .adm-btn-entrar:active:not(:disabled) { transform: translateY(0); }
        .adm-btn-entrar:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        /* Barra de tentativas */
        .adm-tentativas-barra {
            margin-top: 16px;
            display: none;
        }
        .adm-tentativas-label {
            font-size: .72rem;
            color: rgba(255,255,255,.45);
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }
        .adm-tentativas-track {
            height: 4px;
            background: rgba(255,255,255,.1);
            border-radius: 2px;
            overflow: hidden;
        }
        .adm-tentativas-fill {
            height: 100%;
            border-radius: 2px;
            transition: width .3s, background .3s;
        }

        /* Countdown de bloqueio */
        .adm-lockout-msg {
            text-align: center;
            color: #fca5a5;
            font-size: .85rem;
            margin-top: 12px;
            display: none;
        }

        /* Link de cadastro admin */
        .adm-link-cad {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,.08);
            text-align: center;
            font-size: .8rem;
            color: rgba(255,255,255,.35);
        }
        .adm-link-cad a {
            color: rgba(20,106,219,.8);
            text-decoration: none;
            font-weight: 600;
            transition: color .15s;
        }
        .adm-link-cad a:hover { color: #7fb3f5; }

        /* Volta para o site */
        .adm-back-link {
            margin-top: 20px;
            font-size: .78rem;
            color: rgba(255,255,255,.28);
            text-align: center;
        }
        .adm-back-link a {
            color: rgba(255,255,255,.35);
            text-decoration: none;
        }
        .adm-back-link a:hover { color: rgba(255,255,255,.6); }

        /* Spinner loading */
        .adm-spinner {
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: adm-spin .6s linear infinite;
            display: none;
        }
        @keyframes adm-spin { to { transform: rotate(360deg); } }

        /* Responsivo */
        @media (max-width: 480px) {
            .adm-login-card { padding: 28px 20px 24px; }
        }
    </style>
</head>
<body>

<div class="adm-login-page">
    <div class="adm-login-card">

        <!-- Logo -->
        <div class="adm-login-logo">
            <span class="serv-part">Serv</span><span class="go-part">Go!</span>
        </div>
        <div class="text-center mb-3">
            <span class="adm-login-badge">
                <i class="bi bi-shield-fill-check"></i>
                Acesso Administrativo
            </span>
        </div>

        <!-- Alerta dinâmico -->
        <div id="adm-login-alerta" style="display:none;"></div>

        <!-- Formulário -->
        <form id="form-admin-login" autocomplete="off" novalidate>

            <div class="mb-3">
                <label class="adm-field-label" for="adm-email-input">
                    <i class="bi bi-envelope-fill"></i> E-mail Administrativo
                </label>
                <input type="email" class="adm-input" id="adm-email-input"
                       placeholder="admin@servgo.com.br"
                       autocomplete="username" spellcheck="false">
            </div>

            <div class="mb-4">
                <label class="adm-field-label" for="adm-senha-input">
                    <i class="bi bi-lock-fill"></i> Senha
                </label>
                <div class="adm-input-wrap">
                    <input type="password" class="adm-input" id="adm-senha-input"
                           placeholder="••••••••••"
                           autocomplete="current-password"
                           style="padding-right:42px;">
                    <button type="button" class="adm-toggle-senha" id="adm-toggle-senha" tabindex="-1">
                        <i class="bi bi-eye" id="adm-toggle-ico"></i>
                    </button>
                </div>
            </div>

            <!-- Barra de tentativas -->
            <div class="adm-tentativas-barra" id="adm-tentativas-barra">
                <div class="adm-tentativas-label">
                    <span>Tentativas restantes</span>
                    <span id="adm-tentativas-texto">5 de 5</span>
                </div>
                <div class="adm-tentativas-track">
                    <div class="adm-tentativas-fill" id="adm-tentativas-fill"
                         style="width:100%;background:#22c55e;"></div>
                </div>
            </div>

            <!-- Mensagem de bloqueio com countdown -->
            <div class="adm-lockout-msg" id="adm-lockout-msg">
                <i class="bi bi-clock-history me-1"></i>
                Conta bloqueada. Tente novamente em
                <strong id="adm-lockout-countdown"></strong>.
            </div>

            <button type="submit" class="adm-btn-entrar" id="adm-btn-entrar">
                <div class="adm-spinner" id="adm-spinner"></div>
                <i class="bi bi-shield-lock-fill" id="adm-btn-ico"></i>
                <span id="adm-btn-texto">Acessar Painel</span>
            </button>

        </form>

        <!-- Link cadastro admin -->
        <div class="adm-link-cad">
            <i class="bi bi-shield-plus me-1"></i>
            Novo administrador?
            <a href="/paginasSite/adminCadastro.html">Criar conta admin</a>
        </div>

        <!-- Voltar -->
        <div class="adm-back-link">
            <a href="/index.html">
                <i class="bi bi-arrow-left me-1"></i>Voltar ao site
            </a>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/script.js" defer></script>
</body>
</html>
